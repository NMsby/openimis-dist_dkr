x-api: &default-api
  image: ghcr.io/openimis/openimis-be:${BE_TAG:-develop}
  entrypoint:
    - /bin/bash
    - -c
    - 'pip install -e /aletheia-module --no-deps -q --root-user-action=ignore; exec /bin/bash /openimis-be/script/entrypoint.sh "$@"'
    - sh
  environment:
    - DB_DEFAULT=${DB_DEFAULT:-postgresql}
    - DB_HOST=${DB_HOST}
    - DB_PORT=${DB_PORT}
    - DB_NAME=${DB_NAME}
    - DB_USER=${DB_USER}
    - DB_PASSWORD=${DB_PASSWORD}
    - SECRET_KEY=${SECRET_KEY}
    - SITE_ROOT=api
    - SITE_URL=${DOMAIN}
    - CELERY_BROKER_URL=amqp://rabbitmq
    - MODE=${MODE:-Prod}
    - HOSTS=${HOSTS}
    - CACHE_BACKEND=${CACHE_BACKEND}
    - CACHE_URL=${CACHE_URL}
    - CACHE_OPTIONS=${CACHE_OPTIONS}
    - OPENSEARCH_ADMIN=${OPENSEARCH_ADMIN}
    - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
    - OPENSEARCH_HOSTS=${OPENSEARCH_HOSTS}
    - DARAJA_CONSUMER_KEY=${DARAJA_CONSUMER_KEY}
    - DARAJA_CONSUMER_SECRET=${DARAJA_CONSUMER_SECRET}
    - DARAJA_INITIATOR_NAME=${DARAJA_INITIATOR_NAME}
    - DARAJA_SECURITY_CREDENTIAL=${DARAJA_SECURITY_CREDENTIAL}
    - DARAJA_SHORTCODE=${DARAJA_SHORTCODE}
    - DARAJA_TEST_RECIPIENT_PHONE=${DARAJA_TEST_RECIPIENT_PHONE}
    - DARAJA_RESULT_URL=${DARAJA_RESULT_URL}
    - DARAJA_TIMEOUT_URL=${DARAJA_TIMEOUT_URL}
    - DARAJA_BASE_URL=${DARAJA_BASE_URL}
  volumes:
    - photos:/openimis-be/openIMIS/images/insurees
    - type: bind
      source: D:/Dev/aletheia/openimis-be-aletheia_py
      target: /aletheia-module
      read_only: false
    - type: bind
      source: D:/Dev/aletheia/openimis-dist_dkr/conf/openimis.json
      target: /openimis-be/openimis.json
      read_only: true
  depends_on:
    db:
      condition: service_healthy
  networks:
    openimis-net:

services:
  frontend:
    image: ghcr.io/openimis/openimis-fe:${FE_TAG:-develop}
    restart: always
    environment:
      - REACT_APP_SENTRY_DSN=${REACT_APP_SENTRY_DSN}
      - REACT_APP_API_URL=api
      - NEW_OPENIMIS_HOST=${DOMAIN}
      - OPENIMIS_CONF_JSON=${OPENIMIS_FE_CONF_JSON}
      - OPENSEARCH_BASIC_TOKEN=${OPENSEARCH_BASIC_TOKEN}
    networks:
      openimis-net:
      # proxy:
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    depends_on:
      - backend
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      # comment the following line if you are using your own gateway
      - ./conf/nginx:/conf/
      - D:/Dev/aletheia/openimis-fe-aletheia_js/public/aletheia-demo.html:/usr/share/nginx/html/front/aletheia-demo.html
      - D:/Dev/aletheia/openimis-fe-aletheia_js/public/chp-stipend-status.html:/usr/share/nginx/html/front/chp-stipend-status.html
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # Optional: Redirect HTTP to HTTPS
      - "traefik.http.routers.frontend-http.entrypoints=web"
      - "traefik.http.routers.frontend-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  migrations:
    <<: *default-api
    command: init
    restart: no
  backend:
    <<: *default-api
    command: start
    restart: always
    depends_on:
      migrations:
        condition: service_completed_successfully   
      redis:
        condition: service_healthy
  worker:
    <<: *default-api
    command: worker
    restart: always
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: ${WORKER_REPLICAS:-3}
  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    networks:
      openimis-net:
networks:
  # proxy:
  #   external: true
  openimis-net:
    name: "${PROJECT_NAME:-openimis}-net"
volumes:
  database:
  photos:
